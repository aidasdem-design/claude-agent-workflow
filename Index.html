<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body { font-family: system-ui, sans-serif; margin: 2rem; }
      input, button { font-size: 1rem; padding: 0.4rem 0.6rem; }
    </style>
  </head>
  <body>
    <h1>Claude Agent Workflow</h1>
    <input id="name" placeholder="Your name">
    <button onclick="greet()">Greet</button>
    <p id="output"></p>

    <script>
      function greet() {
        const name = document.getElementById('name').value;
        google.script.run
          .withSuccessHandler(msg => document.getElementById('output').textContent = msg)
          .withFailureHandler(err => document.getElementById('output').textContent = 'Error: ' + err.message)
          .getGreeting(name);
      }
    </script>
  </body>
</html>
